[tool.poetry]
name = "ccs-verifier"
version = "1.0.0"
description = "CCS Runtime Governance Layer for LangGraph - Formal behavioral conformance verification based on CCS 1.0 specification"
authors = ["Correctover <wangguigui@correctover.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Correctover/ccs-integration-kit"
keywords = ["ccs", "conformance", "governance", "langgraph", "checkpoint", "runtime", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
langgraph = ">=0.2.0"

[tool.poetry.group.test.dependencies]
pytest = ">=7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
